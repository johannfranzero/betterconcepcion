<!doctype html>
<!--
  Renders the hero image: the real island of Sibale (terrain + Sentinel-2 satellite imagery)
  seen from the sea at dawn. Not part of the site; used to produce assets/images/banners/hero-*.
  Run: serve the repo on :8000, then capture with headless Edge (see tools/README.md).
  Query params: ?w=1920&h=900&lng=..&lat=..&zoom=..&pitch=..&bearing=..
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1d4a; }
      #m { position: absolute; inset: 0; }
      .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
    </style>
  </head>
  <body>
    <div id="m"></div>
    <script>
      const q = new URLSearchParams(location.search);
      const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
      const map = new maplibregl.Map({
        container: 'm',
        canvasContextAttributes: { preserveDrawingBuffer: true },
        preserveDrawingBuffer: true,
        attributionControl: false,
        interactive: false,
        fadeDuration: 0,
        center: [num('lng', 121.712), num('lat', 12.9)],
        zoom: num('zoom', 13.2),
        pitch: num('pitch', 78),
        bearing: num('bearing', -8),
        maxPitch: 85,
        style: {
          version: 8,
          sources: {
            s2: {
              type: 'raster',
              tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg'],
              tileSize: 256,
              maxzoom: 15,
            },
            dem: {
              type: 'raster-dem',
              tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
              encoding: 'terrarium',
              tileSize: 256,
              maxzoom: num('dz', 10),
            },
            omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' },
          },
          layers: [
            { id: 'bg', type: 'background', paint: { 'background-color': '#0d3b66' } },
            {
              id: 's2',
              type: 'raster',
              source: 's2',
              paint: { 'raster-saturation': 0.12, 'raster-contrast': 0.1, 'raster-brightness-max': 1 },
            },
            {
              id: 'sea',
              type: 'fill',
              source: 'omt',
              'source-layer': 'water',
              paint: { 'fill-color': q.get('sea') ? '#' + q.get('sea') : '#1c5e8f', 'fill-opacity': num('so', 0.78) },
            },
          ],
          terrain: { source: 'dem', exaggeration: num('ex', 1.6) },
          sky: {
            'sky-color': '#3b6fc4',
            'horizon-color': '#ffd08a',
            'fog-color': '#f1c48a',
            'sky-horizon-blend': 0.5,
            'horizon-fog-blend': num('hf', 0.7),
            'fog-ground-blend': num('fg', 0.9),
            'atmosphere-blend': 0.6,
          },
        },
      });
      map.on('idle', () => {
        document.title = 'ready';
        document.body.setAttribute('data-ready', '1');
      });
    </script>
  </body>
</html>
