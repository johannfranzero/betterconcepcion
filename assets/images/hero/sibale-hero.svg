<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a green island with hills, a white church and a blue bay">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fe0"/>
      <stop offset="0.55" stop-color="#8cc9f2"/>
      <stop offset="1" stop-color="#d9f0fc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7fc4"/>
      <stop offset="0.45" stop-color="#1aa3b5"/>
      <stop offset="1" stop-color="#35c3c9"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9f86"/>
      <stop offset="1" stop-color="#8dbfa6"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f4e"/>
      <stop offset="1" stop-color="#4fae5c"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6e3a"/>
      <stop offset="1" stop-color="#2d8a45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.35">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="720" fill="url(#sky)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="1180" cy="120" rx="120" ry="34"/><ellipse cx="1260" cy="100" rx="80" ry="40"/><ellipse cx="1110" cy="128" rx="70" ry="24"/>
    <ellipse cx="1460" cy="190" rx="110" ry="28"/><ellipse cx="1520" cy="172" rx="60" ry="30"/>
    <ellipse cx="760" cy="90" rx="90" ry="22"/><ellipse cx="820" cy="78" rx="55" ry="26"/>
  </g>

  <!-- far ridge -->
  <path d="M500 330 C620 250 720 230 820 270 C900 200 1000 180 1110 230 C1200 170 1320 160 1420 220 C1500 200 1560 210 1600 230 L1600 420 L500 420 Z" fill="url(#far)"/>
  <!-- middle hills -->
  <path d="M640 400 C740 300 860 290 960 330 C1060 260 1180 250 1280 300 C1360 260 1470 260 1600 300 L1600 470 L640 470 Z" fill="url(#mid)"/>
  <g fill="#2a8046" opacity="0.6">
    <circle cx="980" cy="330" r="14"/><circle cx="1010" cy="322" r="12"/><circle cx="1290" cy="300" r="13"/><circle cx="1320" cy="296" r="10"/><circle cx="1420" cy="282" r="12"/>
  </g>

  <!-- sea -->
  <path d="M0 400 L1600 400 L1600 720 L0 720 Z" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M120 520 q30 -10 60 0"/><path d="M300 600 q40 -12 80 0"/><path d="M520 540 q30 -10 60 0"/><path d="M220 660 q40 -12 80 0"/><path d="M640 640 q30 -10 60 0"/>
  </g>

  <!-- near headland with bay -->
  <path d="M700 470 C820 420 940 410 1040 440 C1140 400 1300 380 1420 410 C1500 400 1560 410 1600 420 L1600 720 L980 720 C940 640 860 560 700 470 Z" fill="url(#near)"/>
  <!-- beach -->
  <path d="M700 470 C760 480 800 500 830 520 C790 505 750 490 700 478 Z" fill="#f2dfa4"/>

  <!-- town along the shore -->
  <g transform="translate(-230 -6)">
    <g fill="#ffffff"><rect x="905" y="455" width="22" height="16"/><rect x="935" y="450" width="18" height="20"/><rect x="960" y="458" width="24" height="14"/><rect x="990" y="448" width="18" height="22"/><rect x="1015" y="455" width="22" height="16"/><rect x="1045" y="446" width="20" height="22"/></g>
    <g fill="#d8433a"><polygon points="903,455 916,446 929,455"/><polygon points="933,450 944,442 955,450"/><polygon points="988,448 999,440 1010,448"/><polygon points="1043,446 1055,437 1067,446"/></g>
    <g fill="#2a6fb7"><polygon points="958,458 972,449 986,458"/><polygon points="1013,455 1026,446 1039,455"/></g>
  </g>

  <!-- church on the hill -->
  <g transform="translate(905 372) scale(0.75)">
    <rect x="0" y="30" width="70" height="56" fill="#ffffff"/>
    <polygon points="-6,32 35,6 76,32" fill="#e9eef7"/>
    <rect x="52" y="-14" width="26" height="100" fill="#ffffff"/>
    <polygon points="50,-12 65,-38 80,-12" fill="#e9eef7"/>
    <line x1="65" y1="-38" x2="65" y2="-52" stroke="#ffffff" stroke-width="4"/>
    <line x1="58" y1="-46" x2="72" y2="-46" stroke="#ffffff" stroke-width="4"/>
    <path d="M24 86 v-22 a11 11 0 0 1 22 0 v22" fill="#9fb3d1"/>
    <rect x="60" y="4" width="10" height="16" rx="5" fill="#9fb3d1"/>
    <rect x="6" y="44" width="10" height="14" rx="5" fill="#9fb3d1"/>
  </g>

  <!-- foreground palms, left edge -->
  <g fill="#14532d">
    <path d="M0 0 L0 300 C40 250 90 230 150 240 C100 200 60 170 40 110 C90 150 150 160 210 150 C150 120 110 80 100 20 C140 70 200 90 260 80 C200 50 160 20 150 0 Z" opacity="0.92"/>
    <path d="M70 720 C80 600 96 520 120 440" stroke="#5c3d1e" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M120 440 C60 420 10 440 -20 480 C40 460 80 456 120 440 Z"/>
    <path d="M120 440 C170 390 240 390 290 420 C230 414 170 420 120 440 Z"/>
    <path d="M120 440 C100 380 60 350 10 350 C60 370 90 400 120 440 Z"/>
    <path d="M120 440 C180 440 230 470 250 520 C210 486 170 466 120 440 Z"/>
    <path d="M120 440 C130 380 170 340 220 330 C180 360 150 400 120 440 Z"/>
  </g>

  <!-- foreground palm, right edge -->
  <g fill="#14532d">
    <path d="M1600 120 C1560 150 1520 200 1510 260 C1540 220 1570 200 1600 190 Z"/>
    <path d="M1600 210 C1550 230 1500 280 1490 340 C1530 300 1570 270 1600 260 Z" opacity="0.85"/>
  </g>
</svg>
